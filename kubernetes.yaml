apiVersion: v1
kind: Namespace
metadata:
  name: despinoza

---
# 2) ConfigMap: pares clave-valor NO sensibles, disponibles como variable
# de entorno en el Deployment
apiVersion: v1
kind: ConfigMap
metadata:
  name: curso-devops-lab3-config
  namespace: despinoza
data:
  USER_KEY: "soy-un-USER-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: curso-devops-lab3-secret
  namespace: despinoza
type: Opaque
stringData:
  BD_PASSWORD: "soy-un-BD-password"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curso-devops-lab3
  namespace: despinoza
  labels:
    app: curso-devops-lab3
spec:
  replicas: 3  # las 3 replicas requeridas
  selector:
    matchLabels:
      app: curso-devops-lab3
  template:
    metadata:
      labels:
        app: curso-devops-lab3
    spec:
      containers:
        - name: curso-devops-lab3
          image: ghcr.io/athomo001/curso-devops-lab3:latest
          ports:
            - containerPort: 3000
          env:
            - name: USER_KEY
              valueFrom:
                configMapKeyRef:
                  name: curso-devops-lab3-config
                  key: USER_KEY
            - name: BD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: curso-devops-lab3-secret
                  key: BD_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: curso-devops-lab3-svc
  namespace: despinoza
spec:
  selector:
    app: curso-devops-lab3
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
